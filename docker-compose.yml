version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      # Persist the JSON fallback database across container restarts.
      # Remove this volume once you switch to Postgres.
      - inbff_data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

volumes:
  inbff_data:
