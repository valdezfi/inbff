version: "3.9"

services:
  # ── MySQL 8 database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-referly}
      MYSQL_USER:          ${MYSQL_USER:-referly}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-referly}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./affiliate-platform/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"

  # ── Next.js application ─────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV:  production
      PORT:      "3000"
      HOSTNAME:  "0.0.0.0"
      MYSQL_URL: "mysql://${MYSQL_USER:-referly}:${MYSQL_PASSWORD:-referly}@db:3306/${MYSQL_DATABASE:-referly}"
      MYSQL_SSL: "false"
    volumes:
      - inbff_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  inbff_data:
